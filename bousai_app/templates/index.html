{% extends "base.html" %}

{% block content %}
<section class="home-section" aria-labelledby="map-heading">
    <h2 class="section-heading" id="map-heading">
        <span class="section-icon" aria-hidden="true">⌖</span>
        避難所マップ
    </h2>
    <div id="shelterMap" aria-label="避難所周辺の地図"></div>
</section>

<section class="home-section" aria-labelledby="weather-heading">
    <h2 class="section-heading weather-heading" id="weather-heading">
        <span class="heading-label"><span class="section-icon" aria-hidden="true">☼</span>青森市 気象警報・注意報</span>
        <span class="auto-refresh"><span aria-hidden="true">↻</span>10分おき自動更新</span>
    </h2>
    <div id="weatherContent" class="weather-content" aria-live="polite">
        <p class="loading">気象情報を読み込み中...</p>
    </div>
</section>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（藤沢市周辺を中心に設定）
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p class="weather-status is-alert">気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="weather-list">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-status">現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-area"><span aria-hidden="true">⌖</span> ${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-meta">◷ データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-meta">↗ 気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
